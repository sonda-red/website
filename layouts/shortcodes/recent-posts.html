{{- $limit := .Get "limit" | default 5 | int -}}
{{- $posts := where site.RegularPages "Section" "notes" -}}
<div class="lab-note-list">
  {{- range first $limit $posts.ByDate.Reverse -}}
    <a class="lab-note" href="{{ .RelPermalink }}">
      <time class="lab-note__meta" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
      <span class="lab-note__title">{{ .Title }}</span>
      {{- with .Description }}
        <span class="lab-note__summary">{{ . }}</span>
      {{- end }}
    </a>
  {{- end -}}
</div>
